<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Kỹ thuật viên - Thông báo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/notifications.css">
</head>
<body>
<aside class="sidebar">
    <div class="logo">IT <span>Support</span></div>
    <div class="menu-section">Kỹ thuật</div>
    <ul class="menu">
        <li><a href="/technician/dashboard.html"><span class="icon">🏠</span><span>Trang chủ</span></a></li>
        <li><a href="/technician/tickets.html"><span class="icon">🔧</span><span>Ticket của tôi</span></a></li>
        <li><a href="/technician/ai-chat.html"><span class="icon">🤖</span><span>Trợ lý AI</span></a></li>
        <li><a href="/technician/notifications.html" class="active"><span class="icon">🔔</span><span>Thông báo</span></a></li>
    </ul>
    <div class="user-box">
        <div class="avatar" id="avBox">KT</div>
        <div>
            <div class="user-name" id="uName">KTV</div>
            <div class="user-role">Nhân viên kỹ thuật</div>
        </div>
    </div>
</aside>

<main class="main">
    <header class="header">
        <h2>Thông báo</h2>
        <div class="header-right">
            <button class="btn btn-secondary btn-sm" onclick="markAll()">✓ Đánh dấu đã đọc</button>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </header>
    <div class="content">
        <div class="card">
            <div class="card-header">
                <h3>Danh sách thông báo</h3>
            </div>
            <div id="list" class="notif-list">
                <div class="empty"><div class="ei">🔔</div><p>Đang tải...</p></div>
            </div>
        </div>
    </div>
</main>

<script>window.AI_WIDGET_ROLE = 'technician';</script>
<script src="/shared.js"></script>
<script src="/ai-widget.js"></script>
<script>
const ICONS = { info: '💬', warning: '⚠️', error: '🔴' };
(async () => {
    const u = await checkAuth('technician'); if (!u) return;
    document.getElementById('uName').textContent = u.full_name;
    document.getElementById('avBox').textContent = u.full_name.split(' ').slice(-1)[0][0];
    loadList();
})();

async function loadList() {
    const res = await fetch('/api/notifications').then(r => r.json());
    const el = document.getElementById('list');
    if (!res.success || !res.data.length) {
        el.innerHTML = '<div class="empty"><div class="ei">🔔</div><p>Không có thông báo nào</p></div>';
        return;
    }
    el.innerHTML = res.data.map(n => `
        <div class="notif-item ${n.is_read ? '' : 'unread'}">
            <div class="ni-icon ni-${n.type}">${ICONS[n.type] || 'ℹ️'}</div>
            <div class="ni-content">
                <div class="ni-text">${n.message}</div>
                <div class="ni-time">
                    <span>🕒 ${fmtDateTime(n.created_at)}</span>
                    ${!n.is_read ? '<span class="unread-badge-pill">Mới</span>' : ''}
                </div>
            </div>
        </div>`).join('');
}

async function markAll() {
    await fetch('/api/notifications/all/read', { method: 'PATCH' });
    loadList();
    loadNotifCount();
}
</script>
</body>
</html>
