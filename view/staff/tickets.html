<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Nhân viên - Yêu cầu của tôi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<aside class="sidebar">
    <div class="logo">IT <span>Support</span></div>
    <div class="menu-section">Menu</div>
    <ul class="menu">
        <li><a href="/staff/dashboard.html"><span class="icon">🏠</span><span>Trang chủ</span></a></li>
        <li><a href="/staff/tickets.html" class="active"><span class="icon">🎫</span><span>Yêu cầu của tôi</span></a></li>
        <li><a href="/staff/ai-chat.html"><span class="icon">🤖</span><span>Trợ lý AI</span></a></li>
        <li><a href="/staff/notifications.html"><span class="icon">🔔</span><span>Thông báo</span></a></li>
    </ul>
    <div class="user-box">
        <div class="avatar" id="avBox">NV</div>
        <div>
            <div class="user-name" id="uName">Nhân viên</div>
            <div class="user-role">Nhân viên công ty</div>
        </div>
    </div>
</aside>

<main class="main">
    <header class="header">
        <h2>Yêu cầu của tôi</h2>
        <div class="header-right">
            <button class="notif-btn" onclick="location.href='/staff/notifications.html'" title="Thông báo">🔔<span class="notif-badge" style="display:none">0</span></button>
            <button class="btn btn-primary btn-sm" onclick="openCreate()">+ Gửi yêu cầu mới</button>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </header>
    <div class="content">
        <div class="card">
            <div class="card-header">
                <h3>Tất cả yêu cầu hỗ trợ của bạn</h3>
            </div>
            <div class="filter-bar">
                <input id="srch" placeholder="🔍 Tìm theo mã yêu cầu, tiêu đề..." oninput="filterLocal()">
                <select id="fSt" onchange="load()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="new">🆕 Mới</option>
                    <option value="assigned">📬 Đã phân công</option>
                    <option value="processing">🔧 Đang xử lý</option>
                    <option value="waiting">⏳ Chờ phản hồi</option>
                    <option value="done">✅ Hoàn thành</option>
                </select>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Tiêu đề</th>
                            <th>Loại</th>
                            <th>Ưu tiên</th>
                            <th>Trạng thái</th>
                            <th>Kỹ thuật viên</th>
                            <th>Ngày tạo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal" id="createModal">
    <div class="modal-box">
        <div class="modal-head">
            <h2>🎫 Gửi yêu cầu hỗ trợ mới</h2>
            <button class="close-btn" onclick="closeCreate()">✕</button>
        </div>
        <div class="form-grid">
            <div class="form-group full">
                <label>Tiêu đề *</label>
                <input id="cTitle" placeholder="Ví dụ: Máy tính không lên nguồn, lỗi mạng nội bộ...">
            </div>
            <div class="form-group">
                <label>Loại sự cố</label>
                <select id="cCat">
                    <option value="Phần cứng">💻 Phần cứng</option>
                    <option value="Phần mềm">🖥️ Phần mềm</option>
                    <option value="Mạng">🌐 Mạng</option>
                    <option value="Tài khoản">🔑 Tài khoản</option>
                    <option value="Máy in">🖨️ Máy in</option>
                    <option value="Khác">📦 Khác</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mức độ ưu tiên</label>
                <select id="cPri">
                    <option value="low">🟢 Thấp</option>
                    <option value="medium" selected>🟡 Trung bình</option>
                    <option value="high">🔴 Cao</option>
                    <option value="urgent">🚨 Khẩn cấp</option>
                </select>
            </div>
            <div class="form-group full">
                <label>Mô tả chi tiết *</label>
                <textarea id="cDesc" placeholder="Mô tả cụ thể sự cố cần hỗ trợ..."></textarea>
            </div>
            <div class="form-group full">
                <label>📷 Ảnh đính kèm <small style="color:#94a3b8;font-weight:normal">(tuỳ chọn, tối đa 5MB)</small></label>
                <input type="file" id="cImage" accept="image/*" style="font-size:13.5px;padding:8px 0" onchange="previewImg(this)">
                <div style="margin-top:10px;position:relative;display:inline-block">
                    <img id="cPreviewImg" style="max-width:100%;max-height:160px;border-radius:10px;border:1px solid #e2e8f0;object-fit:cover;display:none">
                    <button id="removeImgBtn" onclick="removeImg()" style="position:absolute;top:6px;right:6px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;display:none;box-shadow:0 2px 6px rgba(0,0,0,0.2)">✕</button>
                </div>
            </div>
        </div>
        <div class="form-err" id="cErr"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px">
            <button class="btn btn-secondary" onclick="closeCreate()">Hủy</button>
            <button class="btn btn-primary" id="cBtn" onclick="submitTicket()">Gửi yêu cầu ngay</button>
        </div>
    </div>
</div>

<script>window.AI_WIDGET_ROLE = 'staff';</script>
<script src="/shared.js"></script>
<script src="/ai-widget.js"></script>
<script>
let allData = [];
(async () => {
    const u = await checkAuth('staff'); if (!u) return;
    document.getElementById('uName').textContent = u.full_name;
    document.getElementById('avBox').textContent = u.full_name.split(' ').slice(-1)[0][0];
    loadNotifCount(); load();
    window.addEventListener('click', e => { if (e.target === document.getElementById('createModal')) closeCreate(); });
})();

async function load() {
    const st = document.getElementById('fSt').value;
    const p = new URLSearchParams(); if (st) p.set('status', st);
    const res = await fetch('/api/my/tickets?' + p).then(r => r.json());
    allData = res.success ? res.data : [];
    render(allData);
}

function filterLocal() {
    const q = document.getElementById('srch').value.toLowerCase();
    render(allData.filter(t => t.title.toLowerCase().includes(q) || t.code.toLowerCase().includes(q)));
}

function render(data) {
    const tb = document.getElementById('tbody');
    if (!data.length) {
        tb.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="ei">📭</div><p>Không có yêu cầu nào</p></div></td></tr>';
        return;
    }
    tb.innerHTML = data.map(t => `<tr>
        <td><span class="tid">#${t.code}</span></td>
        <td><b>${t.title}</b></td>
        <td>${t.category || '—'}</td>
        <td>${priorityBadge(t.priority)}</td>
        <td>${statusBadge(t.status)}</td>
        <td>${t.tech_name ? `<b>${t.tech_name}</b>` : '<span style="color:#94a3b8">Chưa phân công</span>'}</td>
        <td>${fmtDate(t.created_at)}</td>
    </tr>`).join('');
}

function openCreate() {
    document.getElementById('cErr').style.display = 'none';
    document.getElementById('cTitle').value = '';
    document.getElementById('cDesc').value = '';
    removeImg();
    document.getElementById('createModal').classList.add('show');
}
function closeCreate() { document.getElementById('createModal').classList.remove('show'); }

function previewImg(input) {
    const file = input.files[0];
    if (!file) return;
    const img = document.getElementById('cPreviewImg');
    const btn = document.getElementById('removeImgBtn');
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';
    btn.style.display = 'block';
}
function removeImg() {
    document.getElementById('cImage').value = '';
    const img = document.getElementById('cPreviewImg');
    const btn = document.getElementById('removeImgBtn');
    img.src = ''; img.style.display = 'none'; btn.style.display = 'none';
}

async function submitTicket() {
    const title = document.getElementById('cTitle').value.trim();
    const desc = document.getElementById('cDesc').value.trim();
    const errEl = document.getElementById('cErr'); errEl.style.display = 'none';
    if (!title || !desc) { errEl.textContent = 'Vui lòng nhập đầy đủ tiêu đề và mô tả'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('cBtn'); btn.disabled = true; btn.textContent = 'Đang gửi...';
    const fd = new FormData();
    fd.append('title', title);
    fd.append('description', desc);
    fd.append('category', document.getElementById('cCat').value);
    fd.append('priority', document.getElementById('cPri').value);
    const imgFile = document.getElementById('cImage').files[0];
    if (imgFile) fd.append('image', imgFile);
    const res = await fetch('/api/my/tickets', { method: 'POST', body: fd }).then(r => r.json()).catch(() => ({ success: false, message: 'Lỗi kết nối máy chủ' }));
    btn.disabled = false; btn.textContent = 'Gửi yêu cầu ngay';
    if (res.success) { closeCreate(); load(); }
    else { errEl.textContent = '⚠️ ' + res.message; errEl.style.display = 'block'; }
}
</script>
</body>
</html>
